<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Task Manager</h1>
    <form id="taskForm">
      <label for="taskInput">New task</label>
      <div class="task-entry">
        <input id="taskInput" placeholder="Enter a task" autocomplete="off" required>
        <button type="submit">Add task</button>
      </div>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <ul id="taskList"></ul>
  </main>

  <script>
    async function loadTasks() {
      const response = await fetch("/api/tasks");
      const tasks = await response.json();
      const list = document.getElementById("taskList");
      list.innerHTML = "";

      tasks.forEach((task) => {
        const item = document.createElement("li");
        const text = document.createElement("span");
        text.textContent = task.title;

        const button = document.createElement("button");
        button.type = "button";
        button.className = "delete-button";
        button.textContent = "Delete";
        button.addEventListener("click", async () => {
          await fetch(`/api/tasks/${task.id}`, { method: "DELETE" });
          await loadTasks();
        });

        item.append(text, button);
        list.appendChild(item);
      });
    }

    document.getElementById("taskForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const input = document.getElementById("taskInput");
      const response = await fetch("/api/tasks", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ task: input.value.trim() })
      });

      const message = document.getElementById("message");
      if (!response.ok) {
        message.textContent = "Could not add task.";
        return;
      }

      input.value = "";
      message.textContent = "Task added.";
      await loadTasks();
    });

    loadTasks().catch(() => {
      document.getElementById("message").textContent = "API is unavailable.";
    });
  </script>
</body>
</html>
